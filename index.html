<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داروخانه دکتر مفتوحیان - دکتر حوری</title>
    <style>
        /* تنظیمات پایه */
        :root {
            --primary-color: #175e64; /* رنگ سبز-آبی کارت ویزیت شما */
            --bg-color: #f5f4ef; /* رنگ پس زمینه کرم کارت ویزیت شما */
            --text-color: #333;
        }

        body {
            font-family: Tahoma, Arial, sans-serif; /* فونت مناسب فارسی */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* بخش هدر و لوگو */
        .header {
            margin-bottom: 30px;
        }
        
        .header img {
            width: 100px; /* اندازه فرضی برای لوگو، اگر لوگو جداگانه دارید */
            margin-bottom: 15px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 5px 0;
        }

        .header h2 {
            font-size: 1.1rem;
            color: #555;
            margin: 0;
            font-weight: normal;
        }

        /* استایل دکمه‌ها (لینک‌ها) */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: var(--text-color);
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative; /* برای قرار دادن آیکون */
        }

        .link-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(23, 94, 100, 0.2);
        }

        /* استایل آیکون‌ها */
        .icon {
            width: 24px;
            height: 24px;
            position: absolute;
            right: 20px; /* فاصله از راست */
            fill: currentColor;
        }
        
        /* دکمه اختصاصی اینستاگرام */
        .btn-instagram:hover {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-color: transparent;
        }
        
        /* دکمه تلگرام */
        .btn-telegram:hover {
            background-color: #0088cc;
            border-color: #0088cc;
        }
        
        /* دکمه واتساپ */
        .btn-whatsapp:hover {
            background-color: #25D366;
            border-color: #25D366;
        }

        /* دکمه ایتا */
        .btn-eitaa:hover {
            background-color: #ff7f00; /* رنگ نارنجی ایتا */
            border-color: #ff7f00;
        }

        /* فوتر */
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- اگر لوگو رو به صورت عکس جداگانه دارید می‌تونید اینجا قرار بدید -->
            <!-- <img src="logo.png" alt="لوگو داروخانه"> -->
            <h1>داروخانه</h1>
            <h2>دکتر سپهر مفتوحیان - دکتر روژین حوری</h2>
            <p style="font-size: 0.9rem; margin-top: 10px;">برای ارتباط با ما یکی از مسیرهای زیر را انتخاب کنید</p>
        </div>

        <div class="links-container">
            
            <!-- لینک واتساپ (شماره رو جایگزین YOUR_NUMBER کنید مثلا 989123456789) -->
            <a href="https://wa.me/YOUR_NUMBER" class="link-btn btn-whatsapp" target="_blank">
                <!-- SVG Icon for WhatsApp -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                پیام در واتساپ
            </a>

            <!-- کانال تلگرام (لینک رو جایگزین https://t.me/YOUR_CHANNEL کنید) -->
            <a href="https://t.me/YOUR_CHANNEL" class="link-btn btn-telegram" target="_blank">
                <!-- SVG Icon for Telegram -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                کانال تلگرام
            </a>

            <!-- شماره تماس تلگرام (لینک رو جایگزین https://t.me/YOUR_USERNAME کنید) -->
            <a href="https://t.me/YOUR_USERNAME" class="link-btn btn-telegram" target="_blank">
                <!-- SVG Icon for Telegram -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                ارتباط در تلگرام
            </a>

            <!-- اینستاگرام (لینک رو جایگزین https://instagram.com/YOUR_PAGE کنید) -->
            <a href="https://instagram.com/YOUR_PAGE" class="link-btn btn-instagram" target="_blank">
                <!-- SVG Icon for Instagram -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                اینستاگرام
            </a>

            <!-- کانال ایتا (لینک رو جایگزین https://eitaa.com/YOUR_CHANNEL کنید) -->
            <a href="https://eitaa.com/YOUR_CHANNEL" class="link-btn btn-eitaa" target="_blank">
                <!-- آیکون ساده به شکل فلش برای ایتا (چون آیکون رسمی ایتا در SVGهای استاندارد نیست) -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                کانال ایتا
            </a>

            <!-- شماره پیام ایتا (لینک رو جایگزین https://eitaa.com/YOUR_USERNAME کنید) -->
            <a href="https://eitaa.com/YOUR_USERNAME" class="link-btn btn-eitaa" target="_blank">
                <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                ارتباط در ایتا
            </a>
            
            <!-- تماس با داروخانه -->
            <a href="tel:02188123456" class="link-btn" style="background-color: var(--primary-color); color: white;">
                <svg class="icon" viewBox="0 0 24 24" style="fill: white;"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                تماس با ما: 02188123456
            </a>

        </div>

        <div class="footer">
            <p>تمامی حقوق برای داروخانه دکتر مفتوحیان محفوظ است.</p>
        </div>
    </div>

</body>
</html>
